# Serves the built React app and proxies API/upload requests to the
# backend container, mirroring the Vite dev-server proxy (see vite.config.js)
# so the frontend code needs no changes between dev and Docker.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx's default (1M) rejects real-world GPX tracks and phone-camera
    # photos before they even reach the backend, with only a terse "413
    # Request Entity Too Large" / "client intended to send too large body"
    # in the nginx log to show for it. 20M comfortably covers both a large
    # multi-hour GPX file and a full-resolution photo upload.
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }
}
