services:
  backend:
    build:
      context: ./backend
    container_name: trailfound-backend
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: trailfound-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend_data:
  backend_uploads:
